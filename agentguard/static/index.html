<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentGuard — Governance Control Plane</title>
  <meta name="description" content="Operator console for the AgentGuard governance control plane — agents, roles, policies, connectors, audit ledger and alerts." />
  <!-- Fully self-contained: no external fonts, icons or scripts (strict CSP safe). -->
  <style>
    :root {
      --void: #04060a;
      --panel: #0a0e15;
      --panel-hi: #0e141d;
      --line: #1a2432;
      --line-soft: #121a26;
      --text: #e8eff7;
      --dim: #8093a8;
      --faint: #55647a;

      --signal: #2fe08a;   /* allow / primary */
      --alarm:  #ff4d5e;   /* deny */
      --warn:   #ffb020;   /* approval / pending */
      --info:   #46b9f5;

      --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --r: 4px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--void);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    /* Blueprint grid + vignette: atmosphere, not decoration. */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        repeating-linear-gradient(0deg, rgba(120,160,200,.05) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(90deg, rgba(120,160,200,.05) 0 1px, transparent 1px 44px);
      mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(47,224,138,.07), transparent 70%);
    }
    #login, #app, #toast, #modalHost { position: relative; z-index: 1; }

    a { color: var(--info); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .muted { color: var(--dim); font-size: 12px; }
    .hash { font-family: var(--mono); font-size: 11px; color: var(--faint); word-break: break-all; }

    /* ---------- brand ---------- */
    .brand {
      display: flex; align-items: center; gap: 9px;
      font-family: var(--mono); font-weight: 600; font-size: 14px;
      letter-spacing: .14em; text-transform: uppercase;
    }
    .brand .dot {
      width: 9px; height: 9px; background: var(--signal);
      box-shadow: 0 0 0 3px rgba(47,224,138,.12), 0 0 14px var(--signal);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
    .sub { color: var(--dim); font-size: 12px; margin: 8px 0 22px; }

    /* ---------- login ---------- */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card {
      width: 380px; background: linear-gradient(180deg, var(--panel-hi), var(--panel));
      border: 1px solid var(--line); border-radius: var(--r); padding: 30px 28px 26px;
      box-shadow: 0 40px 80px -30px #000, inset 0 1px 0 rgba(255,255,255,.04);
      animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .err { color: var(--alarm); font-family: var(--mono); font-size: 11.5px; margin-top: 12px; min-height: 16px; }

    label {
      display: block; font-family: var(--mono); font-size: 10px; font-weight: 600;
      color: var(--faint); margin: 15px 0 6px; text-transform: uppercase; letter-spacing: .16em;
    }
    input, select, textarea {
      width: 100%; background: #06090e; border: 1px solid var(--line); color: var(--text);
      border-radius: var(--r); padding: 9px 11px; font-family: var(--mono); font-size: 12.5px;
      transition: border-color .13s, box-shadow .13s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px rgba(47,224,138,.13);
    }
    textarea { line-height: 1.5; }

    /* ---------- buttons ---------- */
    .btn {
      background: var(--signal); color: #04140c; border: 1px solid var(--signal);
      border-radius: var(--r); padding: 8px 14px;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: filter .13s, transform .13s, background .13s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: none; }
    .btn.secondary {
      background: transparent; color: var(--text); border-color: var(--line);
    }
    .btn.secondary:hover:not(:disabled) { border-color: var(--faint); background: rgba(255,255,255,.03); }
    .btn.deny { background: transparent; color: var(--alarm); border-color: rgba(255,77,94,.4); }
    .btn.deny:hover:not(:disabled) { background: rgba(255,77,94,.1); }
    .btn svg { width: 13px; height: 13px; }
    /* Row-level actions are compact so action columns stay reachable without scrolling. */
    tbody td .btn { padding: 5px 9px; font-size: 9.5px; letter-spacing: .07em; margin-right: 4px; }
    tbody td .btn:last-child { margin-right: 0; }

    /* ---------- app shell ---------- */
    .shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
    .side {
      position: relative; border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(14,20,29,.9), rgba(4,6,10,.9));
      padding: 22px 14px; display: flex; flex-direction: column;
    }
    .nav { display: flex; flex-direction: column; gap: 1px; margin-top: 26px; }
    .nav a {
      position: relative; display: flex; align-items: center; gap: 10px;
      padding: 9px 11px 9px 13px; border-radius: var(--r); cursor: pointer;
      color: var(--dim); font-family: var(--mono); font-size: 11.5px;
      letter-spacing: .06em; transition: color .13s, background .13s;
    }
    .nav a svg { width: 15px; height: 15px; flex: none; opacity: .75; }
    .nav a:hover { color: var(--text); background: rgba(255,255,255,.03); }
    .nav a.active { color: var(--text); background: rgba(47,224,138,.07); }
    .nav a.active svg { color: var(--signal); opacity: 1; }
    .nav a.active::before {
      content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px;
      background: var(--signal); box-shadow: 0 0 10px var(--signal);
    }
    .pill {
      margin-left: auto; background: var(--alarm); color: #fff;
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      padding: 1px 6px; border-radius: 999px; min-width: 18px; text-align: center;
    }
    .side-foot { margin-top: auto; padding-top: 18px; }

    .main { padding: 22px 26px 60px; min-width: 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding-bottom: 16px; margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }
    .topbar h1 {
      margin: 0; font-family: var(--mono); font-size: 15px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase;
    }
    .section-actions { display: flex; align-items: center; gap: 12px; }
    .who {
      font-family: var(--mono); font-size: 11px; color: var(--dim);
      border: 1px solid var(--line); border-radius: var(--r); padding: 5px 10px;
    }

    /* ---------- cards & stats ---------- */
    .card {
      position: relative; background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--r); padding: 16px 18px; margin-bottom: 14px;
      animation: rise .4s cubic-bezier(.2,.7,.3,1) both;
    }
    .grid { display: grid; gap: 12px; }
    .stats { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); margin-bottom: 16px; }
    .stat { padding: 15px 16px 14px; margin: 0; overflow: hidden; }
    .stat::before {
      content: ""; position: absolute; top: 0; left: 0; width: 26px; height: 2px; background: var(--signal);
    }
    .stats .card:nth-child(1) { animation-delay: .02s } .stats .card:nth-child(2) { animation-delay: .05s }
    .stats .card:nth-child(3) { animation-delay: .08s } .stats .card:nth-child(4) { animation-delay: .11s }
    .stats .card:nth-child(5) { animation-delay: .14s } .stats .card:nth-child(6) { animation-delay: .17s }
    .stats .card:nth-child(7) { animation-delay: .20s } .stats .card:nth-child(8) { animation-delay: .23s }
    .stats .card:nth-child(9) { animation-delay: .26s } .stats .card:nth-child(10) { animation-delay: .29s }
    .stat .k {
      font-family: var(--mono); font-size: 9.5px; font-weight: 600; color: var(--faint);
      text-transform: uppercase; letter-spacing: .18em; margin-bottom: 10px;
    }
    .stat .v { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
    .stat .v.small { font-size: 22px; }

    /* ---------- tables ---------- */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 0 12px 10px; font-family: var(--mono); font-size: 9.5px;
      font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .16em;
      border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: rgba(255,255,255,.022); }
    tbody tr:last-child td { border-bottom: none; }
    /* Wide tables scroll inside their card instead of pushing the page sideways. */
    .tw { overflow-x: auto; margin: 2px -4px 0; width: calc(100% + 8px); }
    .tw table { min-width: 680px; }
    .tw::-webkit-scrollbar { height: 8px; }
    .tw::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
    .tw::-webkit-scrollbar-track { background: transparent; }

    /* ---------- badges / chips ---------- */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--mono); font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      padding: 3px 8px; border-radius: 3px; border: 1px solid;
      background: transparent; white-space: nowrap;
    }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.allow, .badge.approved { color: var(--signal); border-color: rgba(47,224,138,.35); background: rgba(47,224,138,.08); }
    .badge.deny, .badge.denied { color: var(--alarm); border-color: rgba(255,77,94,.35); background: rgba(255,77,94,.08); }
    .badge.pending, .badge.require_approval, .badge.approve { color: var(--warn); border-color: rgba(255,176,32,.35); background: rgba(255,176,32,.08); }
    .badge.info { color: var(--info); border-color: rgba(70,185,245,.35); background: rgba(70,185,245,.08); }
    .badge.expired { color: var(--faint); border-color: var(--line); background: rgba(255,255,255,.03); }
    .chip {
      display: inline-block; font-family: var(--mono); font-size: 9.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em; padding: 2px 7px; border-radius: 3px;
      background: rgba(255,176,32,.12); color: var(--warn); border: 1px solid rgba(255,176,32,.3);
    }

    /* ---------- layout helpers ---------- */
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .empty {
      padding: 40px; text-align: center; color: var(--faint);
      font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
      border: 1px dashed var(--line); border-radius: var(--r);
    }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 7px 14px; margin-top: 12px; font-size: 12.5px; }
    .kv .muted { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }

    .policy {
      border: 1px solid var(--line); border-radius: var(--r);
      padding: 10px 12px; margin-bottom: 7px; background: var(--panel-hi);
    }
    .policy summary { cursor: pointer; display: flex; align-items: center; gap: 9px; list-style: none; }
    .policy summary::-webkit-details-marker { display: none; }
    .policy summary b { font-family: var(--mono); font-size: 12px; font-weight: 600; }
    /* Disclosure affordance — without it the rows read as static, not expandable. */
    .caret {
      width: 0; height: 0; flex: none; margin-right: -2px;
      border-left: 4px solid var(--faint); border-top: 3.5px solid transparent;
      border-bottom: 3.5px solid transparent; transition: transform .15s;
    }
    .policy[open] .caret { transform: rotate(90deg); }
    .policy summary:hover .caret { border-left-color: var(--signal); }

    .filter-bar, .tab-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .filter-bar input, .filter-bar select { width: auto; min-width: 130px; }
    .tab-bar .t {
      font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
      padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--r);
      background: transparent; color: var(--dim);
    }
    .tab-bar .t.active { color: var(--signal); border-color: rgba(47,224,138,.4); background: rgba(47,224,138,.08); }
    .pagination { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
    .ledger-status { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; }

    /* ---------- toast & modal ---------- */
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
      background: var(--panel-hi); border: 1px solid var(--signal); color: var(--text);
      font-family: var(--mono); font-size: 12px; padding: 10px 18px; border-radius: var(--r);
      box-shadow: 0 18px 40px -12px #000; z-index: 60;
      animation: rise .25s ease both;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(2,4,7,.78); backdrop-filter: blur(3px);
      display: grid; place-items: center; padding: 24px; z-index: 50;
    }
    .modal {
      width: 520px; max-width: 100%; max-height: 86vh; overflow: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
      padding: 22px 24px; box-shadow: 0 40px 90px -24px #000;
      animation: rise .28s cubic-bezier(.2,.7,.3,1) both;
    }
    .modal h3 {
      margin: 0 0 4px; font-family: var(--mono); font-size: 13px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .14em;
    }

    @media (max-width: 880px) {
      .shell { grid-template-columns: 1fr; }
      .side { flex-direction: row; align-items: center; gap: 14px; padding: 12px 14px; overflow-x: auto; }
      .nav { flex-direction: row; margin-top: 0; flex: none; }
      /* Keep each item on one line so the collapsed bar scrolls cleanly
         instead of wrapping labels into ragged two-line stacks. */
      .nav a { white-space: nowrap; flex: none; }
      .brand { flex: none; }
      .nav a.active::before { display: none; }
      .side-foot { margin: 0; padding: 0; flex: none; }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="dot"></span> AgentGuard</div>
      <div class="sub">Governance control plane for autonomous AI agents</div>
      <label for="email">Operator email</label>
      <input id="email" value="admin@agentguard.local" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" value="admin" autocomplete="current-password" />
      <div style="height:18px"></div>
      <button class="btn" style="width:100%" onclick="doLogin()" aria-label="Sign in">Authenticate</button>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="shell hidden">
    <aside class="side">
      <div class="brand"><span class="dot"></span> AgentGuard</div>
      <nav class="nav" id="nav" aria-label="Main navigation">
        <a data-view="overview" class="active" role="button" tabindex="0" aria-label="Overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg> Overview</a>
        <a data-view="agents" role="button" tabindex="0" aria-label="Agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M9 4h6"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/></svg> Agents</a>
        <a data-view="roles" role="button" tabindex="0" aria-label="Roles and Policies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/><path d="M9.5 12l1.8 1.8 3.4-3.6"/></svg> Roles &amp; Policies</a>
        <a data-view="connectors" role="button" tabindex="0" aria-label="Connectors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6M15 3v6"/><path d="M6 9h12v3a6 6 0 0 1-12 0z"/><path d="M12 18v3"/></svg> Connectors</a>
        <a data-view="ledger" role="button" tabindex="0" aria-label="Audit Ledger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg> Audit Ledger</a>
        <a data-view="approvals" role="button" tabindex="0" aria-label="Approvals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 12.2l2.4 2.4 4.6-4.9"/></svg> Approvals <span id="apprPill" class="pill hidden">0</span></a>
        <a data-view="alerts" role="button" tabindex="0" aria-label="Alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.2"/></svg> Alerts <span id="alertPill" class="pill hidden">0</span></a>
      </nav>
      <div class="side-foot">
        <button class="btn secondary" style="width:100%" onclick="logout()" aria-label="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 3H5v18h7"/></svg> Sign out</button>
      </div>
    </aside>
    <main class="main" role="main">
      <div class="topbar">
        <h1 id="viewTitle">Overview</h1>
        <div class="section-actions">
          <span class="who" id="whoami"></span>
          <button class="btn deny" id="killSwitch" onclick="toggleContainment()" aria-label="Emergency freeze all agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg> <span id="killLabel">Freeze fleet</span></button>
          <button class="btn secondary" onclick="refresh()" aria-label="Refresh data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-13.7-5.4L3 9"/><path d="M4 13a8 8 0 0 0 13.7 5.4L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></svg> Refresh</button>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="alert"></div>
  <div id="modalHost"></div>
  <script>
    const API = "/api";
    let token = localStorage.getItem("agentguard_token") || null;
    let me = null;
    let currentView = "overview";

    // ---- HTTP ----
    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(API + path, Object.assign({}, opts, { headers }));
      if (res.status === 401) { logout(); throw new Error("unauthorized"); }
      if (!res.ok) { throw new Error((await res.json().catch(() => ({}))).detail || res.statusText); }
      return res.status === 204 ? null : res.json();
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 3200);
    }
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    // For a value embedded inside the single-quoted JS-string argument of an
    // onclick handler, esc() alone is not enough — it protects the double-quoted
    // HTML attribute but not the single-quoted JS string nested inside it. An
    // unescaped `'` in the value (e.g. an agent name
    // like `x'); fetch('//evil'); //`) breaks out of that JS string and runs as
    // code the moment an operator clicks the button, with the console's own
    // session token (stored in localStorage) readable to it. JS-string-escape
    // FIRST, then HTML-attribute-escape the result — that order matters, since
    // the browser HTML-decodes the attribute before the JS engine parses it.
    const escJs = (s) => esc(String(s ?? "")
      .replace(/\\/g, "\\\\").replace(/'/g, "\\'")
      .replace(/\n/g, "\\n").replace(/\r/g, "\\r"));

    // ---- Modal ----
    function showModal(html) {
      document.getElementById("modalHost").innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
    }

        const data = await (await fetch(API + "/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        })).json();
        if (!data.access_token) throw new Error(data.detail || "Login failed");
        token = data.access_token; me = data.user;
        localStorage.setItem("agentguard_token", token);
        showApp();
      } catch (e) { document.getElementById("loginErr").textContent = e.message; }

    // ---- Emergency kill switch (org containment) ----
    let contained = false;
    async function refreshContainmentState() {
      try {
        const orgs = await api("/orgs");                 // superadmin sees the list
        const mine = orgs.find(o => o.id === me.org_id) || orgs[0];
        contained = !!(mine && mine.contained);
      } catch { /* non-superadmin: infer from a denied probe is overkill — default false */ }
      paintKillSwitch();
    }
    function paintKillSwitch() {
      const label = document.getElementById("killLabel");
      const btn = document.getElementById("killSwitch");
      if (!label || !btn) return;
      label.textContent = contained ? "Resume fleet" : "Freeze fleet";
      btn.style.background = contained ? "var(--alarm)" : "transparent";
      btn.style.color = contained ? "#04060a" : "var(--alarm)";
    }
    async function toggleContainment() {
      const next = !contained;
      const body = { contained: next };
      if (next) {
        const reason = prompt("Freeze ALL agents in your org. Reason (shown in the audit ledger):", "manual containment");
        if (reason === null) return;  // cancelled
        body.reason = reason || "";
        const mins = prompt("Auto-lift after how many minutes? (blank = hold until you resume)", "");
        if (mins && /^\d+$/.test(mins.trim())) body.duration_minutes = parseInt(mins.trim());
        if (!confirm("This immediately denies every agent action in your org. Continue?")) return;
      }
      try {
        const org = await api("/orgs/containment", { method: "POST", body: JSON.stringify(body) });
        contained = !!org.contained;
        paintKillSwitch();
        const until = org.contained_until ? ` (auto-lifts ${new Date(org.contained_until).toLocaleTimeString()})` : "";
        toast(contained ? `Fleet FROZEN — all agent actions denied.${until}` : "Fleet resumed.");
        render();
      } catch (e) { toast(e.message); }
    }

            <div class="policy" style="padding:9px 11px;display:flex;align-items:center;gap:10px">
              <span class="badge ${confCls[r.confidence] || 'muted'}">${esc(r.confidence)}</span>
              <span class="mono">allow ${esc(r.actions.join(", "))} on ${esc(r.resource)}</span>
              <span class="muted" style="font-size:11px">· ${r.denials} denial(s)</span>
              <button class="btn" style="margin-left:auto;padding:4px 10px" onclick="applyRec(${id}, ${i})" aria-label="Apply recommendation">Apply</button>
            </div>`).join("")}
        </div>` : "";
      const hot = a.denial_hotspots.length ? `
        <div style="margin-top:16px"><b>Denial hotspots</b>
          <div class="tw"><table><thead><tr><th>Resource</th><th>Action</th><th>Denials</th></tr></thead>
          <tbody>${a.denial_hotspots.map(h => `<tr><td class="mono">${esc(h.resource)}</td><td class="mono">${esc(h.action_type)}</td><td class="mono">${h.denials}</td></tr>`).join("")}</tbody></table></div>
        </div>` : "";
      showModal(`<h3 style="margin:0 0 12px">Policy analysis · ${esc(name)}</h3>
        ${findings}${unused}${recBlock}${hot}
        <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn secondary" onclick="closeModal()">Close</button></div>`);
    }
    async function applyRec(roleId, idx) {
      const r = lastRecs[idx];
      if (!r) return;
      // Safe-apply: dry-run the candidate against real denied traffic first.
      let imp;
      try {
        imp = await api(`/roles/${roleId}/policies/preview`, { method: "POST",
          body: JSON.stringify({ resource: r.resource, actions: r.actions }) });
      } catch (e) { return toast(e.message); }
      const warn = (imp.warnings || []).length
        ? "\n\n⚠ " + imp.warnings.join("\n⚠ ") : "";
      const summary =
        `Add allow policy: ${r.actions.join(", ")} on ${r.resource}\n\n` +
        `Impact preview (against recent traffic):\n` +
        `• would newly ALLOW ${imp.would_allow} previously-denied action(s)\n` +
        `• of which ${imp.sensitive_allow} carried DLP findings (secrets/PII)` +
        warn + `\n\nProceed?`;
      if (!confirm(summary)) return;
      try {
        await api(`/roles/${roleId}/recommendations/apply`, { method: "POST",
          body: JSON.stringify({ resource: r.resource, actions: r.actions }) });
        toast("Policy added."); closeModal(); render();
      } catch (e) { toast(e.message); }
    }
    async function addPolicy(rid) {
      const effect = document.getElementById(`pEffect_${rid}`).value;
      const resource = document.getElementById(`pRes_${rid}`).value.trim() || "*";
      const actions = document.getElementById(`pAct_${rid}`).value.split(",").map(s => s.trim()).filter(Boolean);
      const require_approval = document.getElementById(`pAppr_${rid}`).checked;
      const condRaw = document.getElementById(`pCond_${rid}`).value.trim();
      let conditions = {};
      if (condRaw) { try { conditions = JSON.parse(condRaw); } catch { return toast("Conditions must be valid JSON"); } }
      try {
        await api(`/roles/${rid}/policies`, { method: "POST", body: JSON.stringify({ effect, resource, actions: actions.length ? actions : ["*"], conditions, require_approval }) });
        toast("Policy added."); render();
      } catch (e) { toast(e.message); }
    }
    async function editPolicy(rid, pid, ev) {
      if (ev) ev.preventDefault();
      const roles = await api("/roles");
      const role = roles.find(r => r.id === rid);
      const p = role?.policies.find(pp => pp.id === pid);
      if (!p) return toast("Policy not found");
      showModal(`
        <h3>Edit Policy</h3>
        <label>Effect</label><select id="epEffect"><option value="allow" ${p.effect==="allow"?"selected":""}>allow</option><option value="deny" ${p.effect==="deny"?"selected":""}>deny</option></select>
        <label>Name</label><input id="epName" value="${esc(p.name)}" />
        <label>Resource</label><input id="epRes" value="${esc(p.resource)}" />
        <label>Actions (comma-separated)</label><input id="epAct" value="${esc((p.actions||[]).join(', '))}" />
        <label>Conditions (JSON)</label><textarea id="epCond" rows="3">${esc(JSON.stringify(p.conditions||{}))}</textarea>
        <label>Priority</label><input id="epPri" type="number" value="${p.priority}" />
        <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="epAppr" style="width:auto" ${p.require_approval?"checked":""}/> Require approval</label>
        <div class="row" style="margin-top:16px; gap:8px; justify-content:flex-end">
          <button class="btn secondary" onclick="closeModal()">Cancel</button>
          <button class="btn" onclick="savePolicy(${rid}, ${pid})">Save</button>
        </div>`);
    }
    async function savePolicy(rid, pid) {
      let conditions = {};
      const condRaw = document.getElementById("epCond").value.trim();
      if (condRaw) { try { conditions = JSON.parse(condRaw); } catch { return toast("Conditions must be valid JSON"); } }
      const body = {
        effect: document.getElementById("epEffect").value,
        name: document.getElementById("epName").value.trim(),
        resource: document.getElementById("epRes").value.trim() || "*",
        actions: document.getElementById("epAct").value.split(",").map(s => s.trim()).filter(Boolean),
        conditions, priority: parseInt(document.getElementById("epPri").value) || 0,
        require_approval: document.getElementById("epAppr").checked,
      };
      if (!body.actions.length) body.actions = ["*"];
      try { await api(`/roles/${rid}/policies/${pid}`, { method: "PUT", body: JSON.stringify(body) }); closeModal(); toast("Policy updated."); render(); }
      catch (e) { toast(e.message); }
    }
    async function deletePolicy(rid, pid, ev) {
      if (ev) ev.preventDefault();
      await api(`/roles/${rid}/policies/${pid}`, { method: "DELETE" });
      toast("Policy removed."); render();
    }

    // ---- Connectors ----
    async function renderConnectors(el) {
      const conns = await api("/connectors");
      el.innerHTML = `
        <div class="card" style="margin-bottom:14px">
          <b>Register a connector</b>
          <div class="muted" style="margin:4px 0 10px">The plane holds each credential (encrypted) and injects it when executing an agent's call. Agents never receive the secret.</div>
          <div class="row" style="gap:10px; flex-wrap:wrap">
            <input id="coName" placeholder="name (e.g. crm)" style="max-width:150px" aria-label="Connector name" />
            <input id="coUrl" placeholder="base URL (https://api…)" style="max-width:230px" aria-label="Connector base URL" />
            <input id="coDesc" placeholder="description" style="max-width:200px" aria-label="Connector description" />
            <select id="coAuth" style="max-width:130px" onchange="document.getElementById('coHdr').style.display=this.value==='header'?'block':'none'" aria-label="Auth type">
              <option value="none">no auth</option><option value="bearer">bearer</option>
              <option value="header">header</option><option value="basic">basic</option>
            </select>
            <input id="coHdr" placeholder="header name" style="max-width:130px; display:none" value="X-API-Key" aria-label="Auth header name" />
            <input id="coSecret" type="password" placeholder="secret (vaulted)" style="max-width:180px" aria-label="Connector secret" />
            <button class="btn" onclick="createConnector()" aria-label="Add connector">Add connector</button>
          </div>
        </div>
        <div class="card"><div class="tw"><table>
          <thead><tr><th>Name</th><th>Kind</th><th>Base URL</th><th>Auth</th><th>Credential</th><th>Status</th><th></th></tr></thead>
          <tbody>${conns.map(c => `
            <tr>
              <td><b>${esc(c.name)}</b><div class="muted">${esc(c.description)}</div></td>
              <td class="mono">${esc(c.kind)}</td>
              <td class="mono">${esc(c.base_url)}</td>
              <td class="mono">${esc(c.auth_type)}${c.auth_type === "header" ? " ("+esc(c.auth_header_name)+")" : ""}</td>
              <td>${c.has_secret ? '<span class="badge allow">vaulted</span>' : '<span class="muted">none</span>'}</td>
              <td><span class="badge ${c.enabled ? "allow" : "deny"}">${c.enabled ? "enabled" : "disabled"}</span></td>
              <td style="white-space:nowrap">
                <button class="btn info" onclick="testConnector(${c.id})" aria-label="Test connector ${esc(c.name)}">Test</button>
                <button class="btn secondary" onclick="editConnector(${c.id})" aria-label="Edit connector ${esc(c.name)}">Edit</button>
                <button class="btn deny" onclick="deleteConnector(${c.id}, '${escJs(c.name)}')" aria-label="Delete connector ${esc(c.name)}">Delete</button>
              </td>
            </tr>`).join("") || `<tr><td colspan="7" class="empty">No connectors registered.</td></tr>`}
          </tbody></table></div></div>`;
    }
    async function createConnector() {
      const name = document.getElementById("coName").value.trim();
      const base_url = document.getElementById("coUrl").value.trim();
      const description = document.getElementById("coDesc")?.value?.trim() || "";
      const auth_type = document.getElementById("coAuth").value;
      const auth_header_name = document.getElementById("coHdr").value.trim() || "Authorization";
      const auth_secret = document.getElementById("coSecret").value;
      if (!name || !base_url) return toast("Name and base URL required");
      try {
        await api("/connectors", { method: "POST", body: JSON.stringify({ name, description, base_url, auth_type, auth_header_name, auth_secret }) });
        toast("Connector added."); render();
      } catch (e) { toast(e.message); }
    }
    async function editConnector(id) {
      const c = (await api("/connectors")).find(cc => cc.id === id);
      if (!c) return toast("Connector not found");
      showModal(`
        <h3>Edit Connector: ${esc(c.name)}</h3>
        <label>Name</label><input id="ecName" value="${esc(c.name)}" />
        <label>Description</label><input id="ecDesc" value="${esc(c.description)}" />
        <label>Base URL</label><input id="ecUrl" value="${esc(c.base_url)}" />
        <label>Auth type</label><select id="ecAuth"><option value="none" ${c.auth_type==="none"?"selected":""}>none</option><option value="bearer" ${c.auth_type==="bearer"?"selected":""}>bearer</option><option value="header" ${c.auth_type==="header"?"selected":""}>header</option><option value="basic" ${c.auth_type==="basic"?"selected":""}>basic</option></select>
        <label>Auth header name</label><input id="ecHdr" value="${esc(c.auth_header_name)}" />
        <label>New secret (leave blank to keep)</label><input id="ecSecret" type="password" placeholder="unchanged" />
        <div class="row" style="margin-top:16px; gap:8px; justify-content:flex-end">
          <button class="btn secondary" onclick="closeModal()">Cancel</button>
          <button class="btn" onclick="saveConnector(${id})">Save</button>
        </div>`);
    }
    async function saveConnector(id) {
      const body = {
        name: document.getElementById("ecName").value.trim(),
        description: document.getElementById("ecDesc").value.trim(),
        base_url: document.getElementById("ecUrl").value.trim(),
        auth_type: document.getElementById("ecAuth").value,
        auth_header_name: document.getElementById("ecHdr").value.trim() || "Authorization",
        auth_secret: document.getElementById("ecSecret").value,
      };
      try { await api(`/connectors/${id}`, { method: "PUT", body: JSON.stringify(body) }); closeModal(); toast("Connector updated."); render(); }
      catch (e) { toast(e.message); }
    }
    async function testConnector(id) {
      try {
        const r = await api(`/connectors/${id}/test`, { method: "POST" });
        toast(r.reachable ? `${r.name}: reachable (HTTP ${r.status_code})` : `${r.name}: unreachable — ${r.error}`);
      } catch (e) { toast(e.message); }
    }
    async function deleteConnector(id, name) {
      if (!confirm(`Delete connector "${name}"? Agents relying on it will be blocked.`)) return;
      await api(`/connectors/${id}`, { method: "DELETE" });
      toast("Connector deleted."); render();
    }

    // ---- Ledger ----
    let ledgerOffset = 0;
    const LEDGER_LIMIT = 50;
    let ledgerFilters = {};

    function riskBadge(score, factors) {
      if (score == null) return "—";
      const cls = score >= 70 ? "deny" : score >= 40 ? "pending" : score > 0 ? "allow" : "muted";
      const title = (factors && factors.length) ? ` title="${esc(factors.join(', '))}"` : "";
      return `<span class="badge ${cls}"${title}>${score}</span>`;
    }

    function ledgerTable(records) {
      if (!records.length) return `<div class="empty">No decisions recorded yet.</div>`;
      return `<div class="tw"><table><thead><tr><th>#</th><th>Agent</th><th>Action</th><th>Resource</th><th>Decision</th><th>Risk</th><th>Reason</th><th>DLP</th><th>Time</th></tr></thead>
        <tbody>${records.map(r => `
          <tr>
            <td class="mono">${r.seq}</td>
            <td>${esc(r.agent_name)}</td>
            <td class="mono">${esc(r.action_type)}</td>
            <td class="mono" style="min-width:150px;max-width:220px;overflow-wrap:anywhere">${esc(r.resource)}</td>
            <td><span class="badge ${r.decision}">${r.decision.replace("_", " ")}</span></td>
            <td>${riskBadge(r.risk_score, r.risk_factors)}</td>
            <td class="muted" style="max-width:240px">${esc(r.reason)}</td>
            <td>${(r.dlp_findings || []).map(f => `<span class="chip ${f.severity}">${esc(f.detector)}</span>`).join("") || "—"}</td>
            <td class="muted" style="font-size:11px;white-space:nowrap">${new Date(r.created_at).toLocaleString()}</td>
          </tr>`).join("")}</tbody></table></div>`;
    }
    async function renderLedger(el) {
      const params = new URLSearchParams({ limit: LEDGER_LIMIT, offset: ledgerOffset });
      if (ledgerFilters.decision) params.set("decision", ledgerFilters.decision);
      if (ledgerFilters.agent_id) params.set("agent_id", ledgerFilters.agent_id);
      if (ledgerFilters.action_type) params.set("action_type", ledgerFilters.action_type);
      const [records, status] = await Promise.all([api(`/audit/records?${params}`), api("/audit/verify")]);
      el.innerHTML = `
        <div class="card" style="margin-bottom:14px">
          <div class="row between">
            <div class="ledger-status"><span class="dot ${status.valid ? "ok" : "bad"}"></span>
              <b>${status.valid ? "Chain intact" : "TAMPER DETECTED"}</b>
              <span class="muted">· ${status.length} records</span></div>
            <div class="hash">head: ${esc((status.head_hash || "").slice(0, 24))}…</div>
          </div>
        </div>
        <div class="filter-bar">
          <select id="lfDecision" onchange="applyLedgerFilter()" aria-label="Filter by decision">
            <option value="">All decisions</option>
            <option value="allow" ${ledgerFilters.decision==="allow"?"selected":""}>allow</option>
            <option value="deny" ${ledgerFilters.decision==="deny"?"selected":""}>deny</option>
            <option value="require_approval" ${ledgerFilters.decision==="require_approval"?"selected":""}>require_approval</option>
          </select>
          <input id="lfAction" placeholder="action type" value="${esc(ledgerFilters.action_type||"")}" onchange="applyLedgerFilter()" style="max-width:160px" aria-label="Filter by action type" />
          <input id="lfAgent" placeholder="agent id" value="${esc(ledgerFilters.agent_id||"")}" onchange="applyLedgerFilter()" style="max-width:100px" aria-label="Filter by agent ID" />
          <button class="btn secondary" onclick="ledgerFilters={};ledgerOffset=0;render()" aria-label="Clear filters">Clear</button>
        </div>
        <div class="card">${ledgerTable(records)}</div>
        <div class="pagination">
          <button class="btn secondary" ${ledgerOffset === 0 ? "disabled" : ""} onclick="ledgerOffset=Math.max(0,ledgerOffset-${LEDGER_LIMIT});render()" aria-label="Previous page">← Prev</button>
          <span class="muted">Showing ${ledgerOffset+1}–${ledgerOffset+records.length}</span>
          <button class="btn secondary" ${records.length < LEDGER_LIMIT ? "disabled" : ""} onclick="ledgerOffset+=${LEDGER_LIMIT};render()" aria-label="Next page">Next →</button>
        </div>`;
    }
    function applyLedgerFilter() {
      ledgerFilters.decision = document.getElementById("lfDecision")?.value || "";
      ledgerFilters.action_type = document.getElementById("lfAction")?.value?.trim() || "";
      ledgerFilters.agent_id = document.getElementById("lfAgent")?.value?.trim() || "";
      ledgerOffset = 0;
      render();
    }

    // ---- Approvals ----
    let approvalTab = "";
    async function renderApprovals(el) {
      const params = approvalTab ? `?status_filter=${approvalTab}` : "";
      const items = await api(`/approvals${params}`);
      const tabs = ["", "pending", "approved", "denied", "expired"];
      const tabLabels = { "": "All", pending: "Pending", approved: "Approved", denied: "Denied", expired: "Expired" };
      el.innerHTML = `
        <div class="tab-bar">
          ${tabs.map(t => `<button class="t${approvalTab === t ? " active" : ""}" onclick="approvalTab='${t}';render()" aria-label="Show ${tabLabels[t]} approvals">${tabLabels[t]}</button>`).join("")}
        </div>
        <div class="card"><div class="tw"><table>
        <thead><tr><th>#</th><th>Agent</th><th>Action</th><th>Resource</th><th>Reason</th><th>Status</th><th>Resolved by</th><th></th></tr></thead>
        <tbody>${items.map(a => `
          <tr>
            <td class="mono">${a.id}</td>
            <td>${esc(a.agent_name)}</td>
            <td class="mono">${esc(a.action_type)}</td>
            <td class="mono">${esc(a.resource)}</td>
            <td class="muted" style="max-width:240px">${esc(a.reason)}</td>
            <td><span class="badge ${a.status}">${a.status}</span>
              ${a.expires_at && a.status === "pending" ? `<div class="muted" style="font-size:10px">expires ${new Date(a.expires_at).toLocaleString()}</div>` : ""}
            </td>
            <td class="muted">${esc(a.resolved_by || "—")}${a.resolution_note ? `<div style="font-size:11px">${esc(a.resolution_note)}</div>` : ""}</td>
            <td style="white-space:nowrap">${a.status === "pending" ? `
              <button class="btn approve" onclick="resolveApproval(${a.id}, true)" aria-label="Approve request ${a.id}">Approve</button>
              <button class="btn deny" onclick="resolveApproval(${a.id}, false)" aria-label="Deny request ${a.id}">Deny</button>` : "—"}</td>
          </tr>`).join("") || `<tr><td colspan="8" class="empty">No approval requests.</td></tr>`}
        </tbody></table></div></div>`;
    }
    async function resolveApproval(id, approve) {
      const note = approve ? "Approved via console" : prompt("Denial reason:", "Rejected via console");
      if (note === null) return;
      await api(`/approvals/${id}/resolve`, { method: "POST", body: JSON.stringify({ approve, note }) });
      toast(approve ? "Approved." : "Denied.");
      render();
    }

    // ---- Boot ----
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    if (token) showApp();
  </script>
</body>
</html>
