name: Feature request
description: Propose a capability or change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you hit, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: dropdown
    id: security_impact
    attributes:
      label: Does this change a security default?
      description: Anything that makes the system more permissive by default needs explicit justification.
      options:
        - "No — behaviour is unchanged or more restrictive"
        - "Yes — this makes something more permissive by default"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
