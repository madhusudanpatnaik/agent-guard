[project]
name = "agentguard"
version = "0.3.0"
description = "AgentGuard — an orchestration & governance control plane for autonomous AI agents (the firewall + Active Directory for the agentic era)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "we45" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42",
    "alembic>=1.13",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Exact-pinned, not a floor: ruff 0.16 changed its default rule set and
    # surfaced 294 findings across this codebase that 0.15 never flagged, which
    # is exactly what silently broke CI three days after the initial commit.
    # Linters are not like runtime libs — "latest" is a moving enforcement
    # target, not a bugfix. Bump deliberately, verify clean, then bump this pin.
    "ruff==0.15.21",
    "mypy==2.3.0",
]
# Enterprise/scale adapters. Each is optional: the corresponding feature has a
# dependency-free default and lights up only when its extra is installed.
redis = ["redis>=5.0"]                 # rate_limit_backend=redis
dlp-ml = ["presidio-analyzer>=2.2"]    # dlp_providers=["presidio"]
brokers = ["kafka-python>=2.0"]        # kafka broker connectors
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Everything above, for a full enterprise install.
enterprise = [
    "redis>=5.0",
    "presidio-analyzer>=2.2",
    "kafka-python>=2.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentguard", "sdk/agentguard_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["agentguard"]
warn_unused_ignores = true
no_implicit_optional = true
