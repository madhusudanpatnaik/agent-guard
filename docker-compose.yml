services:
  agentguard:
    build: .
    ports:
      - "8080:8080"
    environment:
      AGENTGUARD_ENVIRONMENT: production
      # Required — compose refuses to start if these are unset (fail closed).
      # Generate one with:  openssl rand -hex 32
      AGENTGUARD_SECRET_KEY: ${AGENTGUARD_SECRET_KEY:?set AGENTGUARD_SECRET_KEY (openssl rand -hex 32)}
      AGENTGUARD_DATABASE_URL: postgresql+psycopg://agentguard:agentguard@db:5432/agentguard
      AGENTGUARD_BOOTSTRAP_ADMIN_EMAIL: admin@agentguard.local
      AGENTGUARD_BOOTSTRAP_ADMIN_PASSWORD: ${AGENTGUARD_BOOTSTRAP_ADMIN_PASSWORD:?set AGENTGUARD_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
      POSTGRES_DB: agentguard
    volumes:
      - agentguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentguard_pgdata:
